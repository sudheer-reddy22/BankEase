
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankEase | Register</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            background: #f2f6fc;
        }

        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #082c63, #1769aa);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
        }

        .left-panel h1 {
            font-size: 40px;
            line-height: 1.2;
            margin: 25px 0 18px;
        }

        .left-panel p {
            line-height: 1.8;
            color: #dceaff;
        }

        .brand {
            font-size: 28px;
            font-weight: bold;
        }

        .right-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 40px #14325a15;
        }

        h2 {
            color: #102b50;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            color: #243b5a;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5deeb;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #1769aa40;
            border-color: #1769aa;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.7;
        }

        #message {
            margin-top: 15px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: #718096;
            font-size: 14px;
            line-height: 1.7;
        }

        a {
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 760px) {
            body {
                flex-direction: column;
            }

            .left-panel {
                padding: 28px;
            }

            .left-panel h1 {
                font-size: 30px;
            }

            .right-panel {
                padding: 25px 16px;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>
    <section class="left-panel">
        <div class="brand">BankEase</div>
        <h1>Start your banking journey.</h1>
        <p>Create your account and manage your finances in one place.</p>
    </section>

    <main class="right-panel">
        <div class="card">
            <h2>Create account</h2>
            <p class="subtitle">Enter your details to register with BankEase.</p>

            <form id="registerForm">
                <label for="name">Full name</label>
                <input id="name" type="text" required maxlength="100"
                       autocomplete="name" placeholder="Enter your full name">

                <label for="email">Email address</label>
                <input id="email" type="email" required maxlength="150"
                       autocomplete="email" placeholder="Enter your email">

                <label for="phone">Phone number</label>
                <input id="phone" type="tel" required maxlength="20"
                       autocomplete="tel" placeholder="Enter your phone number">

                <label for="password">Password</label>
                <input id="password" type="password" required minlength="8"
                       autocomplete="new-password"
                       placeholder="At least 8 characters">

                <button id="registerButton" type="submit">Create Account</button>
                <p id="message" role="status" aria-live="polite"></p>
            </form>

            <p class="footer">
                Already registered?
                <a href="index.html">Sign in</a>
            </p>
        </div>
    </main>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("registerButton");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            button.disabled = true;
            button.textContent = "Creating account...";
            message.textContent = "";

            try {
                const response = await fetch("/api/users/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: document.getElementById("name").value.trim(),
                        email: document.getElementById("email").value.trim(),
                        phone: document.getElementById("phone").value.trim(),
                        password: document.getElementById("password").value
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(
                        data.message || data.detail ||
                        (response.status === 409
                            ? "This email is already registered. Please sign in."
                            : "Registration failed. Please check your details.")
                    );
                }

                message.style.color = "#16803d";
                message.textContent =
                    "Registration successful! You can now sign in.";

                form.reset();
            } catch (error) {
                message.style.color = "#c62828";
                message.textContent =
                    error.message || "Unable to connect to the server.";
            } finally {
                button.disabled = false;
                button.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
